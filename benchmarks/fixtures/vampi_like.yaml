openapi: "3.0.0"
info:
  title: Vulnerable Test API (Benchmark Fixture)
  version: "1.0.0"
  description: >
    Deliberately vulnerable API modelling OWASP API Top 10 weaknesses.
    Used for ARIA detection coverage benchmarking.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/v1/users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:       {type: integer}
                  username: {type: string}
                  email:    {type: string}
                  token:    {type: string}
                  password: {type: string}

  /api/v1/admin/users:
    get:
      summary: List all users (admin only)
      operationId: adminListUsers
      tags: [admin]
      responses:
        "200":
          description: All users

  /api/v1/auth/login:
    post:
      summary: Authenticate and return JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}

  /api/v1/users:
    post:
      summary: Register a new user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email]
              properties:
                username: {type: string}
                email:    {type: string}
                password: {type: string}
      responses:
        "201":
          description: Created user object

  /api/v1/search:
    post:
      summary: Full-text product search
      operationId: searchProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:    {type: string}
                category: {type: string}
      responses:
        "200":
          description: Search results
